<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Muddy Chatroom</title>
        <script type="importmap">
            {
                "imports": {
                    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
                    "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
                    "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
                    "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
                }
            }
        </script>
        <script src="index.js" type="module"></script>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div id="app"></div>

        <template id="template">
            <div class="screen-selector">
                <!-- HOME ROUTE: ?page=home -->
                <section v-if="currentRoute === 'home'" class="screen">
                    <nav class="top-nav">
                        <div class="nav-left">
                            <button
                                v-if="isLoggedIn"
                                class="settings-icon-btn"
                                type="button"
                                @click="openSettings"
                                aria-label="Open settings"
                            >
                                ⚙️
                            </button>
                        </div>

                        <div class="nav-center">
                            <button class="nav-link active-nav" @click="goHome">Home</button>
                            <button class="nav-link" @click="goLogin">Login</button>

                            <span v-if="isFinishingLogin" class="signed-in-pill">
                                Finishing login...
                            </span>

                            <span v-else-if="isLoggedIn" class="signed-in-pill">
                                Signed in as {{ myDisplayName }}
                            </span>

                            <span v-else-if="session === undefined" class="signed-in-pill">
                                Checking login...
                            </span>

                            <span v-else class="signed-in-pill">
                                Not signed in
                            </span>
                        </div>

                        <div class="nav-right"></div>
                    </nav>
                    <div
                        v-if="isSettingsOpen"
                        class="settings-backdrop"
                        @click.self="closeSettings"
                    >
                        <div class="settings-panel">
                            <div class="settings-header">
                                <button class="preset-icon-btn" type="button" @click="closeSettings">
                                    ←
                                </button>

                                <h2>Settings</h2>

                                <span></span>
                            </div>

                            <div class="settings-profile-preview">
                                <graffiti-get-media
                                    v-if="profilePhotoIsMediaDraft"
                                    :url="profilePhotoDraft"
                                    :accept="{ types: ['image/*'] }"
                                >
                                    <template #default="{ media }">
                                        <img
                                            v-if="media && media.dataUrl"
                                            :src="media.dataUrl"
                                            alt="Profile preview"
                                        />

                                        <img
                                            v-else
                                            :src="DEFAULT_PROFILE_PHOTO_URL"
                                            alt="Profile preview"
                                        />
                                    </template>
                                </graffiti-get-media>

                                <img
                                    v-else
                                    :src="profilePhotoDraft || DEFAULT_PROFILE_PHOTO_URL"
                                    alt="Profile preview"
                                />
                            </div>

                            <p v-if="statusMessage" class="status-message settings-status">
                                {{ statusMessage }}
                            </p>

                            <form class="settings-card" @submit.prevent="saveProfileSettings">
                                <div class="settings-line settings-copy-line">
                                    <span>Graffiti username:</span>

                                    <input
                                        :value="myGraffitiUsername || 'Loading...'"
                                        type="text"
                                        readonly
                                    />

                                    <button
                                        class="settings-copy-btn"
                                        type="button"
                                        :disabled="!myGraffitiUsername"
                                        @click="copyGraffitiUsername"
                                    >
                                        Copy
                                    </button>
                                </div>

                                <label class="settings-line" for="profile-name-input">
                                    <span>Display name:</span>

                                    <input
                                        id="profile-name-input"
                                        v-model="profileNameDraft"
                                        type="text"
                                        placeholder="Username"
                                    />
                                </label>

                                <label class="settings-line" for="profile-photo-input">
                                    <span>Profile photo:</span>

                                    <input
                                        id="profile-photo-input"
                                        type="file"
                                        accept="image/*"
                                        @change="handleProfilePhotoSelect"
                                    />
                                </label>

                                <button class="settings-save-btn" type="submit">
                                    Save Profile
                                </button>
                            </form>
                        </div>
                    </div>

                    <div v-if="isLoggedIn" class="utility-row">
                        <input v-model="newChatTitle" placeholder="Chat title" />
                        <button class="pill" @click="newChat">Create</button>

                        <!-- <button
                            class="pill chat-edit-toggle"
                            type="button"
                            @click="toggleChatEditMode"
                        >
                            {{ isEditingChats ? "Done" : "Edit" }}
                        </button> -->
                        <button
                            v-if="isLoggedIn"
                            class="chat-trash-toggle"
                            :class="{ active: isEditingChats }"
                            type="button"
                            @click="toggleChatEditMode"
                            :aria-label="isEditingChats ? 'Done deleting chats' : 'Delete chats'"
                        >
                            {{ isEditingChats ? "✅" : "🗑️" }}
                        </button>
                    </div>

                    <p v-if="statusMessage && !isAnyChatModalOpen" class="status-message">
                        {{ statusMessage }}
                    </p>

                    <div v-if="session === undefined">Checking login...</div>

                    <div v-else-if="!isLoggedIn" class="status-message">
                        Log in to see your chats.
                    </div>

                    <div v-else-if="areChatsLoading">Loading chats...</div>

                    <div v-else-if="sortedChats.length === 0" class="status-message">
                        You do not have any chats yet.
                    </div>

                    <div v-else class="chat-grid">
                        <chat-card
                            v-for="chat in sortedChats"
                            :key="chat.url"
                            :chat="chat"
                            :show-image="true"
                            :editing="isEditingChats"
                            :deleting="isDeletingChat.has(chat.value.channel)"
                            @open-chat="openChat"
                            @delete-chat="deleteChatFromHome"
                        ></chat-card>
                    </div>
                </section>

                <!-- LOGIN ROUTE: ?page=login -->
                <section v-else-if="currentRoute === 'login'" class="screen login-screen">
                    <div class="login-panel">
                        <h1>Login</h1>

                        <p v-if="isFinishingLogin" class="login-status">
                            Finishing login...
                        </p>

                        <p v-else-if="session === undefined" class="login-status">
                            Loading login status...
                        </p>

                        <div v-else-if="isLoggedIn" class="login-actions">
                            <p class="login-status">
                                Signed in as <actor-handle :actor="activeActor"></actor-handle>
                            </p>

                            <button class="pill" @click="logOut">
                                Log Out
                            </button>

                            <button class="pill" @click="goHome">
                                Go Home
                            </button>
                        </div>

                        <div v-else class="login-actions">
                            <p class="login-status">
                                You are not signed in.
                            </p>

                            <button class="pill" @click="logIn">
                                Log In with Graffiti
                            </button>

                            <button class="pill" @click="goHome">
                                Back Home
                            </button>
                        </div>

                        <p v-if="statusMessage" class="status-message">
                            {{ statusMessage }}
                        </p>
                    </div>
                </section>

                <!-- CHAT ROUTE: ?page=chat&chatId=... -->
                <section v-else-if="currentRoute === 'chat' && activeChat" class="screen chat-view">
                    <div class="chat-header">
                        <button class="icon-btn" @click="closeChat" aria-label="Back">
                            ←
                        </button>

                        <div class="title-wrap">
                            <button
                                class="chat-center chat-logo-button"
                                type="button"
                                @click="openGroupDetails"
                                aria-label="Open group details"
                            >
                                <graffiti-get-media
                                    v-if="isGroupPhotoMedia(activeChat)"
                                    :url="activeChat.value.icon"
                                    :accept="{ types: ['image/*'] }"
                                >
                                    <template #default="{ media }">
                                        <img
                                            v-if="media && media.dataUrl"
                                            :src="media.dataUrl"
                                            alt="Group"
                                        />

                                        <img
                                            v-else
                                            :src="DEFAULT_GROUP_PHOTO_URL"
                                            alt="Group"
                                        />
                                    </template>
                                </graffiti-get-media>

                                <img
                                    v-else
                                    :src="getChatPhotoUrl(activeChat)"
                                    alt="Group"
                                />
                            </button>

                            <button class="statuses-button" type="button" @click="openStatuses">
                                Statuses {{ myCurrentStatus }}
                            </button>

                            <h2 class="chat-title">{{ activeChat.value.title }}</h2>
                        </div>

                        <button class="calendar-icon-btn" @click="openCalendar" aria-label="Open calendar">
                            🗓️
                        </button>
                    </div>

                    <p v-if="statusMessage && !isAnyChatModalOpen" class="status-message">
                        {{ statusMessage }}
                    </p>

                    <!-- <div class="utility-row">
                        <input v-model="actorToAdd" placeholder="Username" />
                        <button class="pill" @click="addToChat">Add Person</button>
                    </div>

                    <div class="members-panel">
                        <div class="members-title">Members</div>

                        <ul class="members-list">
                            <li v-for="member in activeChatMembers" :key="member">
                                <actor-handle :actor="member"></actor-handle>
                            </li>
                        </ul>
                    </div> -->

                    <div
                        class="messages"
                        ref="messagesEl"
                        @scroll.passive="updateMessageStickiness"
                    >
                        <div v-if="areMessageObjectsLoading">Loading messages...</div>

                        <message-bubble
                            v-else
                            v-for="message in sortedMessageObjects"
                            :key="message.url"
                            :message="message"
                            :own="isOwnMessage(message)"
                            :deleting="isDeleting.has(message.url)"
                            :whooshing="whooshingMessageUrl === message.url"
                            @delete-message="deleteMessage(message)"
                        ></message-bubble>
                    </div>
                    <div
                        v-if="isMessageMediaPreviewOpen"
                        class="media-preview-backdrop"
                        @click.self="cancelMessageMediaPreview"
                    >
                        <div class="media-preview-panel">
                            <div class="media-preview-header">
                                <button
                                    class="preset-icon-btn"
                                    type="button"
                                    @click="cancelMessageMediaPreview"
                                >
                                    ←
                                </button>

                                <h2>Preview</h2>

                                <span></span>
                            </div>

                            <div class="media-preview-content">
                                <img
                                    v-if="pendingMessageMediaIsImage"
                                    :src="pendingMessageMediaPreviewUrl"
                                    alt="Selected image preview"
                                    class="media-preview-image"
                                />

                                <video
                                    v-else-if="pendingMessageMediaIsVideo"
                                    :src="pendingMessageMediaPreviewUrl"
                                    class="media-preview-video"
                                    controls
                                    playsinline
                                ></video>
                            </div>

                            <input
                                v-model="myMessage"
                                class="media-preview-caption"
                                type="text"
                                placeholder="Add a caption"
                            />

                            <div class="media-preview-actions">
                                <button
                                    class="media-preview-btn media-preview-cancel"
                                    type="button"
                                    @click="cancelMessageMediaPreview"
                                >
                                    Cancel
                                </button>

                                <button
                                    class="media-preview-btn"
                                    type="button"
                                    :disabled="isSending"
                                    @click="confirmSendMessageMedia"
                                >
                                    {{ isSending ? "Sending..." : "Send" }}
                                </button>
                            </div>
                        </div>
                    </div>
                    <div
                        v-if="isGroupDetailsOpen"
                        class="statuses-backdrop"
                        @click.self="closeGroupDetails"
                    >
                        <div class="group-details-panel">
                            <div class="statuses-header">
                                <button class="preset-icon-btn" type="button" @click="closeGroupDetails">
                                    ←
                                </button>

                                <h2>Group Details</h2>

                                <span></span>
                            </div>

                            <div class="group-photo-preview">
                                <graffiti-get-media
                                    v-if="groupChatPhotoIsMediaDraft"
                                    :url="groupChatPhotoDraft"
                                    :accept="{ types: ['image/*'] }"
                                >
                                    <template #default="{ media }">
                                        <img
                                            v-if="media && media.dataUrl"
                                            :src="media.dataUrl"
                                            alt="Group photo preview"
                                        />

                                        <img
                                            v-else
                                            :src="DEFAULT_GROUP_PHOTO_URL"
                                            alt="Group photo preview"
                                        />
                                    </template>
                                </graffiti-get-media>

                                <img
                                    v-else
                                    :src="groupChatPhotoDraft || DEFAULT_GROUP_PHOTO_URL"
                                    alt="Group photo preview"
                                />
                            </div>

                            <p v-if="statusMessage" class="status-message group-details-status">
                                {{ statusMessage }}
                            </p>

                            <div class="group-details-card">
                                <form class="group-details-line" @submit.prevent="renameGroupChat">
                                    <label for="group-name-input">Group name:</label>

                                    <input
                                        id="group-name-input"
                                        v-model="groupChatTitleDraft"
                                        type="text"
                                        placeholder="Group name"
                                    />

                                    <button class="group-details-action-btn" type="submit">
                                        Save
                                    </button>
                                </form>

                                <form class="group-details-line" @submit.prevent="updateGroupChatPhoto">
                                    <label for="group-photo-input">Group photo:</label>

                                    <input
                                        id="group-photo-input"
                                        type="file"
                                        accept="image/*"
                                        @change="handleGroupPhotoSelect"
                                    />

                                    <button class="group-details-action-btn" type="submit">
                                        Upload
                                    </button>
                                </form>

                                <form class="group-details-line" @submit.prevent="addToChat">
                                    <label for="add-person-input">Add person:</label>

                                    <input
                                        id="add-person-input"
                                        v-model="actorToAdd"
                                        type="text"
                                        placeholder="Username"
                                    />

                                    <button class="group-details-action-btn" type="submit">
                                        Add
                                    </button>
                                </form>
                            </div>

                            <div class="group-details-card members-card">
                                <div class="group-details-card-title">Members</div>

                                <div class="group-members-grid">
                                    <div
                                        v-for="member in activeChatMembers"
                                        :key="member"
                                        class="group-member-tile"
                                    >
                                        <div class="group-member-photo">
                                            <graffiti-get-media
                                                v-if="isMemberProfilePhotoMedia(member)"
                                                :url="getMemberProfilePhotoUrl(member)"
                                                :accept="{ types: ['image/*'] }"
                                            >
                                                <template #default="{ media }">
                                                    <img
                                                        v-if="media && media.dataUrl"
                                                        :src="media.dataUrl"
                                                        alt="Member profile photo"
                                                    />

                                                    <img
                                                        v-else
                                                        :src="DEFAULT_PROFILE_PHOTO_URL"
                                                        alt="Member profile placeholder"
                                                    />
                                                </template>
                                            </graffiti-get-media>

                                            <img
                                                v-else
                                                :src="getMemberProfilePhotoUrl(member)"
                                                alt="Member profile photo"
                                            />
                                        </div>

                                        <div class="group-member-name">
                                            <actor-handle :actor="member"></actor-handle>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="group-details-danger-zone">
                                    <button
                                        class="group-leave-btn"
                                        type="button"
                                        :disabled="isLeavingChat"
                                        @click="leaveGroupChat"
                                    >
                                        {{ isLeavingChat ? "Leaving..." : "Leave Group Chat" }}
                                    </button>
                            </div>
                        </div>
                    </div>
                    
                    <div
                        v-if="isCalendarOpen"
                        class="event-backdrop"
                        @click.self="closeCalendar"
                    >
                        <div class="event-panel calendar-panel">
                            <div class="event-header">
                                <button class="preset-icon-btn" type="button" @click="closeCalendar">
                                    ←
                                </button>

                                <h2>Calendar</h2>

                                <span></span>
                            </div>

                            <p v-if="statusMessage" class="status-message modal-status-message">
                                {{ statusMessage }}
                            </p>

                            <button
                                class="calendar-graphic calendar-button"
                                type="button"
                                @click="openRsvpEvents"
                            >
                                <div class="calendar-top">
                                    {{ calendarMonthLabel }}
                                    <small>{{ calendarYearLabel }}</small>
                                </div>

                                <div class="calendar-weekdays">
                                    <span>S</span>
                                    <span>M</span>
                                    <span>T</span>
                                    <span>W</span>
                                    <span>T</span>
                                    <span>F</span>
                                    <span>S</span>
                                </div>

                                <div class="calendar-grid-mini">
                                    <span
                                        v-for="day in calendarDays"
                                        :key="day.key"
                                        :class="{ marked: day.hasRsvp, empty: !day.day }"
                                    >
                                        {{ day.day }}
                                    </span>
                                </div>
                            </button>

                            <button class="rsvp-count-pill" type="button" @click="openRsvpEvents">
                                RSVP’d events
                            </button>

                            <div v-if="sortedEventObjects.length" class="event-preview-list">
                                <div
                                    v-for="event in sortedEventObjects"
                                    :key="event.url"
                                    class="event-preview-row"
                                >
                                    <div>
                                        <strong>{{ formatEventDate(event) }}</strong>
                                        {{ event.value.title }}
                                        <span class="event-small-time">
                                            {{ formatEventTime(event) }}
                                        </span>
                                    </div>

                                    <button
                                        v-if="!isRsvped(event)"
                                        class="event-small-btn"
                                        type="button"
                                        @click="rsvpToEvent(event)"
                                    >
                                        RSVP
                                    </button>

                                    <button
                                        v-else
                                        class="event-small-btn event-unrsvp-btn"
                                        type="button"
                                        @click="unRsvpFromEvent(event)"
                                    >
                                        Un-RSVP
                                    </button>
                                </div>
                            </div>

                            <p v-else class="event-empty-text">
                                No events scheduled yet.
                            </p>

                            <button class="schedule-event-btn" type="button" @click="openScheduleEvent">
                                Schedule an Event
                            </button>
                        </div>
                    </div>
                    <div
                        v-if="isStatusesOpen"
                        class="statuses-backdrop"
                        @click.self="closeStatuses"
                    >
                        <div class="statuses-panel">
                            <div class="statuses-header">
                                <button class="preset-icon-btn" type="button" @click="closeStatuses">
                                    ←
                                </button>

                                <h2>Statuses</h2>

                                <span></span>
                            </div>

                            <p v-if="statusMessage" class="status-message modal-status-message">
                                {{ statusMessage }}
                            </p>

                            <div class="my-status-editor">
                                <div class="my-status-title">
                                    Your status: <span>{{ myCurrentStatus }}</span>
                                </div>

                                <div class="status-choice-grid">
                                    <button
                                        v-for="emoji in statusChoices"
                                        :key="emoji"
                                        class="status-choice"
                                        :class="{ selected: selectedStatusEmoji === emoji }"
                                        type="button"
                                        @click="selectedStatusEmoji = emoji"
                                    >
                                        {{ emoji }}
                                    </button>
                                </div>

                                <div class="custom-status-row">
                                    <input
                                        v-model="customStatusEmoji"
                                        maxlength="4"
                                        placeholder="Custom emoji"
                                    />

                                    <button
                                        class="status-save-btn"
                                        type="button"
                                        @click="updateMyStatus()"
                                    >
                                        Update
                                    </button>
                                </div>
                            </div>

                            <div class="status-members-list">
                                <div
                                    v-for="memberStatus in activeChatMemberStatuses"
                                    :key="memberStatus.actor"
                                    class="status-member-row"
                                >
                                    <span class="status-member-emoji">
                                        {{ memberStatus.status }}
                                    </span>

                                    <span class="status-member-name">
                                        <actor-handle :actor="memberStatus.actor"></actor-handle>
                                        <small v-if="memberStatus.isOwn">(you)</small>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div
                        v-if="isRsvpEventsOpen"
                        class="event-backdrop"
                        @click.self="closeRsvpEvents"
                    >
                        <div class="event-panel rsvp-panel">
                            <div class="event-header">
                                <button class="preset-icon-btn" type="button" @click="closeRsvpEvents">
                                    ←
                                </button>

                                <h2>RSVP’d</h2>

                                <span></span>
                            </div>

                            <p v-if="statusMessage" class="status-message modal-status-message">
                                {{ statusMessage }}
                            </p>

                            <div v-if="myRsvpedEvents.length" class="rsvp-event-list">
                                <div
                                    v-for="event in myRsvpedEvents"
                                    :key="event.url"
                                    class="rsvp-event-row"
                                >
                                    <strong>{{ formatEventDate(event) }}</strong>

                                    <span>{{ event.value.title }}</span>

                                    <small>{{ formatEventTime(event) }}</small>

                                    <button
                                        class="event-small-btn event-unrsvp-btn"
                                        type="button"
                                        @click="unRsvpFromEvent(event)"
                                    >
                                        Un-RSVP
                                    </button>
                                </div>
                            </div>

                            <p v-else class="event-empty-text">
                                You have not RSVP’d to any events yet.
                            </p>
                        </div>
                    </div>

                    <div
                        v-if="isScheduleEventOpen"
                        class="event-backdrop"
                        @click.self="cancelScheduleEvent"
                    >
                        <form class="event-panel schedule-panel" @submit.prevent="scheduleEvent">
                            <h2>Schedule</h2>

                            <p v-if="statusMessage" class="status-message modal-status-message">
                                {{ statusMessage }}
                            </p>

                            <div class="schedule-field">
                                <label for="event-date-input">Date:</label>
                                <input
                                    id="event-date-input"
                                    v-model="eventDate"
                                    type="date"
                                    @click="openNativePicker"
                                />
                            </div>

                            <div class="schedule-field">
                                <label for="event-time-input">Time:</label>
                                <input
                                    id="event-time-input"
                                    v-model="eventTime"
                                    type="time"
                                    @click="openNativePicker"
                                />
                            </div>

                            <div class="schedule-field">
                                <label for="event-visibility-input">Visibility:</label>
                                <select
                                    id="event-visibility-input"
                                    v-model="eventVisibility"
                                    @click="openNativePicker"
                                >
                                    <option value="chat">Everyone in chat</option>
                                    <option value="private">Only me</option>
                                </select>
                            </div>

                            <div class="schedule-field">
                                <label for="event-repeat-input">Repeat:</label>
                                <select
                                    id="event-repeat-input"
                                    v-model="eventRepeat"
                                    @click="openNativePicker"
                                >
                                    <option value="none">Does not repeat</option>
                                    <option value="daily">Daily</option>
                                    <option value="weekly">Weekly</option>
                                    <option value="biweekly">Every 2 weeks</option>
                                </select>
                            </div>

                            <div
                                v-if="eventRepeat !== 'none'"
                                class="schedule-field"
                            >
                                <label for="event-repeat-until-input">Until:</label>
                                <input
                                    id="event-repeat-until-input"
                                    v-model="eventRepeatUntil"
                                    type="date"
                                    @click="openNativePicker"
                                />
                            </div>

                            <div class="schedule-field">
                                <label for="event-title-input">Title:</label>
                                <input
                                    id="event-title-input"
                                    v-model="eventTitle"
                                    type="text"
                                />
                            </div>

                            <div class="schedule-actions">
                                <button type="button" class="schedule-action-btn" @click="cancelScheduleEvent">
                                    Cancel
                                </button>

                                <button type="submit" class="schedule-action-btn">
                                    Confirm
                                </button>
                            </div>
                        </form>
                    </div>
                    <div
                        v-if="isPresetMenuOpen"
                        class="preset-backdrop"
                        @click.self="closePresetMenu"
                    >
                        <div class="preset-panel">
                            <div class="preset-header">
                                <button class="preset-icon-btn" type="button" @click="closePresetMenu">
                                    ←
                                </button>

                                <div class="preset-title-wrap">
                                    <h2>Presets</h2>

                                    <button
                                        v-if="!isPresetEditorOpen"
                                        class="preset-small-btn preset-edit-btn"
                                        type="button"
                                        @click="togglePresetEditMode"
                                    >
                                        {{ isEditingPresets ? "Done" : "Edit" }}
                                    </button>
                                </div>

                                <button
                                    v-if="!isPresetEditorOpen"
                                    class="preset-icon-btn"
                                    type="button"
                                    @click="openNewPresetEditor"
                                >
                                    +
                                </button>

                                <span v-else class="preset-icon-spacer"></span>
                            </div>

                            <!-- PRESET LIST VIEW -->
                            <div v-if="!isPresetEditorOpen">
                                <div v-if="presets.length === 0" class="preset-empty">
                                    <p>No presets yet.</p>

                                    <button
                                        class="preset-large-btn"
                                        type="button"
                                        @click="openNewPresetEditor"
                                    >
                                        Add Preset
                                    </button>
                                </div>

                                <div v-else class="preset-list">
                                    <button
                                        v-for="(preset, index) in presets"
                                        :key="preset.id"
                                        class="preset-row"
                                        :class="{ shaking: isEditingPresets }"
                                        type="button"
                                        @click="isEditingPresets ? openPresetEditor(index) : sendPreset(preset)"
                                    >
                                        <span class="preset-emoji">{{ preset.emoji }}</span>
                                        <span class="preset-message">{{ preset.message }}</span>
                                    </button>
                                </div>
                            </div>

                            <!-- ADD / EDIT VIEW -->
                            <form v-else class="preset-editor-form" @submit.prevent="savePreset">
                                <label class="preset-field">
                                    Emoji
                                    <input
                                        v-model="presetEmoji"
                                        placeholder="Type emoji here:"
                                        autocomplete="off"
                                    />
                                </label>

                                <label class="preset-field">
                                    Message
                                    <textarea
                                        v-model="presetMessage"
                                        rows="3"
                                        placeholder="Type your message here:"
                                    ></textarea>
                                </label>

                                <div class="preset-editor-actions">
                                    <button
                                        v-if="editingPresetIndex !== null"
                                        class="preset-danger-btn"
                                        type="button"
                                        @click="deletePreset"
                                    >
                                        Delete
                                    </button>

                                    <button
                                        class="preset-small-btn"
                                        type="button"
                                        @click="closePresetEditor"
                                    >
                                        Cancel
                                    </button>

                                    <button class="preset-small-btn" type="submit">
                                        Confirm
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="bottom-bar">
                        <button class="pill" type="button" @click="togglePresetMenu">
                            Presets
                        </button>

                        <form class="send-wrap" @submit.prevent="sendMessage">
                            <button
                                class="plus-btn"
                                type="button"
                                @click="openMessageMediaPicker"
                                aria-label="Add image or video"
                            >
                                ⊕
                            </button>

                            <input
                                ref="messageMediaInput"
                                class="message-media-input"
                                type="file"
                                accept="image/*,video/*"
                                @change="sendSelectedMessageMedia"
                            />

                            <input v-model="myMessage" placeholder="Type a message" />

                            <button class="pill" type="submit" :disabled="isSending">
                                {{ isSending ? "Sending..." : "Send" }}
                            </button>
                        </form>
                    </div>
                </section>

                <!-- FALLBACK / CHAT LOADING -->
                <section v-else class="screen login-screen">
                    <div class="login-panel">
                        <h1>Chat not found</h1>

                        <p v-if="areChatsLoading">
                            Loading chat...
                        </p>

                        <p v-else>
                            This chat does not exist yet, or it has not loaded.
                        </p>

                        <button class="pill" @click="goHome">
                            Back Home
                        </button>
                    </div>
                </section>
            </div>
        </template>
        <template id="message-bubble-template">
           <div
                class="message-bubble-row"
                :class="{ own: own, 'message-whoosh': whooshing }"
            >
                <div class="message-bubble-shell" :class="{ own: own, incoming: !own }">
                    <div class="message-meta">
                        <span class="message-author">
                            <span v-if="own">You</span>
                            <actor-handle
                                v-else-if="message.actor"
                                :actor="message.actor"
                            ></actor-handle>
                            <span v-else>Unknown user</span>
                        </span>
                        <span class="message-time">{{ formattedTime }}</span>
                    </div>

                    <div v-if="message.value.content" class="message-content">
                        {{ message.value.content }}
                    </div>

                    <div v-if="message.value.mediaUrl" class="message-media">
                        <graffiti-get-media
                            :url="message.value.mediaUrl"
                            :accept="{ types: ['image/*', 'video/*'] }"
                        >
                            <template #default="{ media }">
                                <img
                                    v-if="isImageMessage && media && media.dataUrl"
                                    :src="media.dataUrl"
                                    :alt="message.value.mediaName || 'Shared image'"
                                    class="message-media-image"
                                />

                                <video
                                    v-else-if="isVideoMessage && media && media.dataUrl"
                                    :src="media.dataUrl"
                                    class="message-media-video"
                                    controls
                                    playsinline
                                ></video>

                                <a
                                    v-else-if="media && media.dataUrl"
                                    :href="media.dataUrl"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="message-media-link"
                                >
                                    Open attachment
                                </a>

                                <span v-else class="message-media-loading">
                                    Loading attachment...
                                </span>
                            </template>
                        </graffiti-get-media>
                    </div>

                    <div v-if="own" class="message-actions">
                        <button
                            class="delete-message-btn"
                            @click="$emit('delete-message')"
                        >
                            {{ deleting ? "Deleting..." : "Delete" }}
                        </button>
                    </div>
                </div>
            </div>
        </template>
        <template id="chat-card-template">
            <div
                class="chat-card-wrap"
                :class="{ shaking: editing }"
            >
                <button
                    class="chat-card"
                    type="button"
                    @click="editing ? $emit('delete-chat', chat) : $emit('open-chat', chat)"
                >
                    <div class="chat-icon">
                        <div
                            class="petal"
                            v-for="petalIndex in 8"
                            :key="petalIndex"
                            :style="{ '--i': petalIndex - 1 }"
                        ></div>

                        <div class="chat-center">
                            <graffiti-get-media
                                v-if="showImage && chatPhotoIsMedia"
                                :url="chatPhotoUrl"
                                :accept="{ types: ['image/*'] }"
                            >
                                <template #default="{ media }">
                                    <img
                                        v-if="media && media.dataUrl"
                                        :src="media.dataUrl"
                                        alt="Group"
                                    />

                                    <img
                                        v-else
                                        :src="DEFAULT_GROUP_PHOTO_URL_FOR_CARD"
                                        alt="Group"
                                    />
                                </template>
                            </graffiti-get-media>

                            <img
                                v-else-if="showImage"
                                :src="chatPhotoUrl"
                                alt="Group"
                            />
                        </div>
                    </div>

                    <div class="chat-label">{{ chat.value.title }}</div>
                </button>

                <!-- <button
                    v-if="editing"
                    class="chat-delete-btn"
                    type="button"
                    :disabled="deleting"
                    @click.stop="$emit('delete-chat', chat)"
                >
                    {{ deleting ? "..." : "🗑️" }}
                </button> -->
            </div>
        </template>
    </body>
</html>
